# Cloud builds for the Armed & Anchored phone apps (codemagic.io).
# Each build: install → build the web app → copy it into the iOS/Android project → compile.
# The website on Vercel is not affected by anything in this file.

definitions:
  supabase_vars: &supabase_vars
    # Public values the app already ships to every browser. Not secrets.
    VITE_SUPABASE_URL: https://awcnjducdrphgqvpksod.supabase.co
    VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3Y25qZHVjZHJwaGdxdnBrc29kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDM5MjUsImV4cCI6MjA5NDc3OTkyNX0.R3xh4ks38DPvGh7YvqRdRpUbCo6AM8WI1UsXSce9V9o
  build_web: &build_web
    name: Build the web app
    script: |
      npm ci
      npm run build

workflows:
  android-preview:
    name: Android preview (installable APK)
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      vars:
        <<: *supabase_vars
    scripts:
      - *build_web
      - name: Copy into the Android project
        script: npx cap sync android
      - name: Build the APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # The name you give your App Store Connect API key in Codemagic → Team settings → Integrations.
      app_store_connect: Elora Radiance
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eloraradiance.armedandanchored
      node: 22
      xcode: latest
      vars:
        <<: *supabase_vars
    scripts:
      - *build_web
      - name: Copy into the iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Give this build a new build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Build the iPhone app
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
