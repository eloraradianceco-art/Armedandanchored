# Cloud builds for the Armed & Anchored phone apps (codemagic.io).
# Each build: install → build the web app → copy it into the iOS/Android project → compile.
# The website on Vercel is not affected by anything in this file.
# The app connects to the shared Elora Radiance database (set in src/supabaseClient.js),
# so no database settings are needed here.
#
# Before the first iOS build, in this order (the Android preview needs none of this):
#  1. Apple Developer → Identifiers: App ID com.eloraradiance.armedandanchored.
#  2. App Store Connect → Apps: create the app with that bundle ID.
#  3. App Store Connect → Users and Access → Integrations: an App Store Connect API key (App Manager).
#     Codemagic → Personal Account → Integrations → Developer Portal: add that key, named exactly "Elora Radiance"
#     (the same key The Living Planner build uses).
#  4. Codemagic → Personal Account → codemagic.yaml settings → Code signing identities → iOS certificates:
#     "Generate certificate" (Apple Distribution, key "Elora Radiance"). One certificate serves both apps.
#  5. Apple Developer → Profiles → +: an "App Store Connect" profile for this App ID, using that certificate.
#  6. Codemagic → Code signing identities → iOS provisioning profiles: "Fetch profiles" and tick the new one.
# Without steps 4 to 6 the build stops at once with "No matching profiles found for bundle identifier …":
# `ios_signing` below only uses certificates and profiles already saved in Codemagic; it does not create them.

definitions:
  build_web: &build_web
    name: Build the web app
    script: |
      npm ci
      npm run build

workflows:
  android-preview:
    name: Android preview (installable APK)
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - *build_web
      - name: Copy into the Android project
        script: npx cap sync android
      - name: Build the APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk

  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # The name given to the App Store Connect API key in Codemagic → Personal Account → Integrations.
      app_store_connect: Elora Radiance
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eloraradiance.armedandanchored
      node: 22
      xcode: latest
    scripts:
      - *build_web
      - name: Copy into the iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Give this build a new build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Build the iPhone app
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
