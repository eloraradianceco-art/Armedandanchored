<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0, viewport-fit=cover"/>
    <title>Armed & Anchored — Spiritual Warfare Training Journal</title>
    <link rel="apple-touch-icon" href="/icon.png"/>
    <link rel="icon" type="image/png" href="/icon.png"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Armed & Anchored"/>
    <meta name="theme-color" content="#070E17"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet"/>
    <style>
      @keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.fu{animation:fu .35s ease both}
      @keyframes fi{from{opacity:0}to{opacity:1}}.fi{animation:fi .25s ease both}
      @keyframes sd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}.sd{animation:sd .28s ease both}
      *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
      body{background:#070E17;margin:0;overscroll-behavior:none;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
      button{transition:all .2s ease;cursor:pointer}
      button:hover{filter:brightness(1.1);transform:translateY(-1px)}
      button:active{transform:scale(0.97) translateY(0)!important}
      textarea:focus,input:focus{border-color:rgba(176,138,78,0.45)!important;box-shadow:0 0 0 3px rgba(176,138,78,0.08)!important;outline:none!important}
      ::-webkit-scrollbar{width:4px}
      ::-webkit-scrollbar-thumb{background:rgba(158,40,40,0.3);border-radius:3px}
      textarea,input{resize:vertical;font-family:"EB Garamond",Georgia,serif;font-size:16px!important}
      html,body,#root{height:100%;min-height:100vh}
    </style>
    <meta name="description" content="Spiritual Warfare Training Journal — Armed & Anchored by Elora Radiance Co."/>
      <!-- iPad Home Screen app: iPadOS 26 blurs a band below the status bar (solid with Reduce
         Transparency). Headers keep their text below it; see --safe-top / --top-band. -->
    <style>:root{--top-band:0px;--safe-top:env(safe-area-inset-top,0px)}.ipad-app{--top-band:32px;--safe-top:calc(env(safe-area-inset-top,0px) + 32px)}</style>
    <!-- New address (Nov 2026): the old vercel.app address forwards here and brings this device's
         sign-in and saved settings along (in the #er-moved part of the link, which never reaches a server). -->
    <script>
    (function () {
      var OLD = 'armedandanchored.vercel.app', NEW = 'https://armed.eloraradiance.com', KEY = 'er-moved';
      try {
        if (location.hostname === OLD) {
          if (location.pathname.indexOf('/api/') === 0) return;
          var keys = [], data = {}, size = 0;
          for (var i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
          keys.sort(function (a, b) { return (localStorage.getItem(a) || '').length - (localStorage.getItem(b) || '').length; });
          keys.forEach(function (k) { var v = localStorage.getItem(k); if (v != null && size + v.length < 60000) { data[k] = v; size += v.length; } });
          var dest = NEW + location.pathname + location.search;
          if (keys.length) { try { dest += '#' + KEY + '=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data))))); } catch (e) {} }
          var installed = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
          if (!installed) { location.replace(dest); return; }
          // Home Screen app on the old address: explain the move instead of jumping out of the app.
          document.addEventListener('DOMContentLoaded', function () {
            var d = document.createElement('div');
            d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', 'We have moved');
            d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#070E17;color:#EDE6D6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;font-family:Georgia,serif';
            d.innerHTML = '<div style="font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#CFA968;margin-bottom:14px">Armed &amp; Anchored</div>'
              + '<div style="font-size:26px;line-height:1.25;margin-bottom:14px">We have a new home</div>'
              + '<p style="font-size:17px;line-height:1.6;max-width:340px;margin:0 0 8px">Armed &amp; Anchored now lives at <b>' + NEW.replace('https://', '') + '</b>. Your account and everything you saved are safe.</p>'
              + '<p style="font-size:16px;line-height:1.6;max-width:340px;margin:0 0 24px;opacity:.85">Tap below, then in Safari tap <b>Share → Add to Home Screen</b>. After that you can delete this old icon.</p>'
              + '<a target="_blank" rel="noopener" style="display:inline-block;background:#CFA968;color:#070E17;text-decoration:none;font-weight:700;font-size:17px;padding:14px 26px;border-radius:999px;font-family:system-ui,sans-serif">Open the new Armed &amp; Anchored</a>'
              + '<button type="button" style="margin-top:18px;background:none;border:0;color:inherit;opacity:.8;font-size:15px;text-decoration:underline;min-height:44px;font-family:inherit">Keep using this one for now</button>';
            d.querySelector('a').href = dest;
            d.querySelector('button').onclick = function () { d.remove(); };
            document.body.appendChild(d);
          });
        } else if (location.hash.indexOf('#' + KEY + '=') === 0) {
          var moved = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(KEY.length + 2))))));
          for (var k in moved) if (localStorage.getItem(k) === null) localStorage.setItem(k, moved[k]);
          history.replaceState(null, '', location.pathname + location.search);
        }
      } catch (e) {}
    })();
    </script>
    <script>(function(){try{var d=document.documentElement,n=navigator,ipad=/iPad/.test(n.userAgent)||(n.platform==='MacIntel'&&n.maxTouchPoints>1),app=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||n.standalone===true;if(ipad&&app)d.classList.add('ipad-app')}catch(e){}})()</script>
    <!-- Install + link previews -->
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elora Radiance Co." />
    <meta property="og:title" content="Armed &amp; Anchored — Spiritual Warfare Training Journal" />
    <meta property="og:description" content="Spiritual warfare training — 26 weapons of the believer, each with Scripture, teaching, prayer and a journal. By Elora Radiance Co." />
    <meta property="og:url" content="https://armed.eloraradiance.com/" />
    <meta property="og:image" content="https://armed.eloraradiance.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
